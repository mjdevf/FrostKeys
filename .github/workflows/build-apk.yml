name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release (minified)
        run: ./gradlew assembleRelease

      - name: Sign release APK (keystore dari step, no source edit)
        run: |
          # cari build-tools — ANDROID_HOME kosong di runner, pakai SDK manager layout
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            # fallback: cari dari local.properties / gradle
            SDK_ROOT=$(find /usr/local/lib/android -maxdepth 2 -type d -name "build-tools" 2>/dev/null | head -1 | xargs dirname)
          fi
          BT=$(ls -d "$SDK_ROOT"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BT"
          # generate ephemeral keystore — cukup buat installable, bukan rilis publik
          keytool -genkeypair -v \
            -keystore release.jks -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass frostkeys-ci -keypass frostkeys-ci \
            -dname "CN=FrostKeys CI, OU=CI, O=CI, L=CI, S=CI, C=ID"
          APK=$(ls app/build/outputs/apk/release/*-release*.apk | head -1)
          # zipalign (harus sebelum apksigner)
          "${BT}zipalign" -f 4 "$APK" app-aligned.apk
          # sign
          "${BT}apksigner" sign \
            --ks release.jks --ks-key-alias release \
            --ks-pass pass:frostkeys-ci --key-pass pass:frostkeys-ci \
            --out app-signed.apk app-aligned.apk
          mv app-signed.apk "$APK"
          echo "signed: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrostKeys-release
          path: app/build/outputs/apk/release/*-release*.apk

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
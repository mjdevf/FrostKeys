name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release (minified)
        id: gradle_build
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Surface build errors to job summary
        if: steps.gradle_build.outcome == 'failure'
        run: |
          {
            echo "## ❌ Gradle errors"
            echo '```'
            grep -nE "^e: |error:|FAILURE:|Caused by:|> Task .* FAILED|Execution failed" build.log | head -60
            echo '```'
            echo "## Tail of log"
            echo '```'
            tail -120 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Restore or create persistent release keystore
        uses: actions/cache@v4
        with:
          path: ci-keystore
          key: release-keystore-v1

      - name: Sign release APK (keystore dari step, no source edit)
        run: |
          # cari build-tools — ANDROID_HOME kosong di runner, pakai SDK manager layout
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            # fallback: cari dari local.properties / gradle
            SDK_ROOT=$(find /usr/local/lib/android -maxdepth 2 -type d -name "build-tools" 2>/dev/null | head -1 | xargs dirname)
          fi
          BT=$(ls -d "$SDK_ROOT"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BT"
          mkdir -p ci-keystore
          # keystore di-cache lintas run (key: release-keystore-v1) biar signing cert konsisten —
          # kalau digenerate ulang tiap run, APK baru ga bisa install sebagai update (signature mismatch)
          if [ ! -f ci-keystore/release.jks ]; then
            echo "cache miss — generate keystore baru + random password"
            CI_KS_PASS=$(openssl rand -hex 24)
            echo "$CI_KS_PASS" > ci-keystore/pass.txt
            keytool -genkeypair -v \
              -keystore ci-keystore/release.jks -alias release -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$CI_KS_PASS" -keypass "$CI_KS_PASS" \
              -dname "CN=FrostKeys CI, OU=CI, O=CI, L=CI, S=CI, C=ID"
          else
            echo "cache hit — reuse existing keystore biar signing cert konsisten antar build"
          fi
          CI_KS_PASS=$(cat ci-keystore/pass.txt)
          APK=$(ls app/build/outputs/apk/release/*-release*.apk | head -1)
          # zipalign (harus sebelum apksigner)
          "${BT}zipalign" -f 4 "$APK" app-aligned.apk
          # sign
          "${BT}apksigner" sign \
            --ks ci-keystore/release.jks --ks-key-alias release \
            --ks-pass "pass:$CI_KS_PASS" --key-pass "pass:$CI_KS_PASS" \
            --out app-signed.apk app-aligned.apk
          mv app-signed.apk "$APK"
          echo "signed: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrostKeys-release
          path: app/build/outputs/apk/release/*-release*.apk

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}